<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">CAT evidence and trust boundaries</title><desc id="desc">Human-approved intent flows through counterfactual witnesses and oracle calibration, then a candidate is evaluated in an isolated local boundary. Public evidence is projected separately from private sealed evidence. Decisions may reject, accept within scope, or abstain. P04 accepted control is omitted in this release.</desc><defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f4f1e8}.muted{fill:#b3b1a8}.small{font-size:18px}.label{font-size:16px;letter-spacing:2px;font-weight:700}.title{font-size:36px;font-weight:700}.box{fill:#1a1b17;stroke:#45463e;stroke-width:2}.line{stroke:#9ba28b;stroke-width:3;fill:none}.public{stroke:#6ebf95}.private{stroke:#d5ae61}.reject{stroke:#da7b72}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9ba28b"/></marker></defs><rect width="1400" height="780" fill="#11120f"/><text x="70" y="70" class="label muted">COUNTERFACTUAL ACCEPTANCE TESTING</text><text x="70" y="125" class="title">Acceptance evidence, made inspectable</text><text x="70" y="160" class="small muted">Recorded public workflow · no code execution or inference in the Console</text><g><rect class="box" x="70" y="235" width="245" height="125" rx="14"/><text x="95" y="275" class="label">01 / INTENT</text><text x="95" y="315" class="small">Human-approved</text><text x="95" y="342" class="small">behavior</text><rect class="box" x="385" y="235" width="245" height="125" rx="14"/><text x="410" y="275" class="label">02 / WITNESS</text><text x="410" y="315" class="small">Counterfactual</text><text x="410" y="342" class="small">distinguishing case</text><rect class="box" x="700" y="235" width="245" height="125" rx="14"/><text x="725" y="275" class="label">03 / ORACLE</text><text x="725" y="315" class="small">Calibrate evidence</text><text x="725" y="342" class="small">and existing tests</text><rect class="box" x="1015" y="235" width="315" height="125" rx="14"/><text x="1040" y="275" class="label">04 / EVALUATION</text><text x="1040" y="315" class="small">Isolated candidate run</text><text x="1040" y="342" class="small">when separately authorized</text></g><path class="line" marker-end="url(#arrow)" d="M315 298h58M630 298h58M945 298h58"/><rect class="box" x="170" y="470" width="500" height="190" rx="14"/><rect x="170" y="470" width="500" height="190" rx="14" fill="none" class="public" stroke-width="3"/><text x="200" y="515" class="label">PUBLIC PROJECTION</text><text x="200" y="555" class="small">Fixed allowlist · canonical JSON · hashes</text><text x="200" y="592" class="small">Two supported cases · sanitized receipts</text><text x="200" y="628" class="small muted">P04 accepted control omitted: strict closure incomplete</text><rect class="box" x="730" y="470" width="500" height="190" rx="14"/><rect x="730" y="470" width="500" height="190" rx="14" fill="none" class="private" stroke-width="3"/><text x="760" y="515" class="label">PRIVATE EVALUATION EVIDENCE</text><text x="760" y="555" class="small">Sealed annex · holdouts · raw model I/O</text><text x="760" y="592" class="small">Local-only; never served by the Console</text><text x="760" y="628" class="small muted">Absent P04 annex prevents accepted-control claim</text><path class="line public" marker-end="url(#arrow)" d="M1170 360v52H420v48"/><path class="line private" d="M1170 360v52h-190v48"/><text x="70" y="725" class="small muted">Outcomes: REJECT · ACCEPT WITHIN EVALUATED SCOPE · HUMAN REQUIRED / INCONCLUSIVE</text></svg>